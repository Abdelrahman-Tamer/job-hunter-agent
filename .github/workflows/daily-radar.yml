name: Daily Frontend Opportunity Radar

on:
  schedule:
    # 09:00 Africa/Cairo in winter (UTC+2) -> 07:00 UTC
    # Note: During Egypt summer DST (UTC+3, late April to late October), update to '0 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-run even if daily run already completed today'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily-radar:
    name: Execute Daily Opportunity Radar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m alembic upgrade head

      - name: Run Daily Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          SOCIAL_SEARCH_API_KEY: ${{ secrets.SOCIAL_SEARCH_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: "Africa/Cairo"
          FORCE_RUN: ${{ inputs.force || 'false' }}
          LINKEDIN_SOCIAL_ENABLED: "true"
          EGYPT_COMMUNITY_ENABLED: "true"
          JOBICY_ENABLED: "true"
          WORKABLE_ENABLED: "true"
          HIMALAYAS_ENABLED: "true"
          REMOTIVE_ENABLED: "true"
        run: |
          python - <<'EOF'
          import asyncio
          import os
          import sys

          from src.core.database import async_session_factory
          from src.models.enums import RunStatus
          from src.scheduler.runner import DailyPipelineRunner

          async def main() -> None:
              force_input = os.getenv("FORCE_RUN", "false").lower() == "true"
              print(f"Starting daily frontend radar run (force={force_input})...")
              runner = DailyPipelineRunner()
              async with async_session_factory() as session:
                  run = await runner.execute_daily_run(session, force=force_input)

              if run is None or getattr(run, "status", None) == RunStatus.FAILED:
                  status_label = getattr(run, "status", "None")
                  print(f"Daily radar run failed with status: {status_label}", file=sys.stderr)
                  sys.exit(1)

              print(f"Daily radar completed successfully with status: {run.status}")
              sys.exit(0)

          if __name__ == "__main__":
              try:
                  asyncio.run(main())
              except Exception as exc:
                  print(f"Daily radar encountered an unhandled exception: {exc}", file=sys.stderr)
                  sys.exit(1)
          EOF
