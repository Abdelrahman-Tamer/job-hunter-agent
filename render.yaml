services:
  - type: web
    name: bottajobs
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: TIMEZONE
        value: Africa/Cairo
      - key: TELEGRAM_POLLING
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DIGEST_CRON_HOUR
        value: "9"
      - key: DIGEST_CRON_MINUTE
        value: "0"
