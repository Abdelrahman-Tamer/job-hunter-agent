<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Circular Base with Transparent Canvas -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)"/>
  <circle cx="32" cy="32" r="29" stroke="url(#ringGrad)" stroke-width="2" stroke-opacity="0.9"/>

  <!-- Radar / Crosshair Reticle Behind Head -->
  <circle cx="32" cy="32" r="20" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.4"/>
  <line x1="32" y1="6" x2="32" y2="12" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="52" x2="32" y2="58" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="12" y2="32" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="58" y2="32" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- AI Agent Antenna / Beacon -->
  <line x1="32" y1="14" x2="32" y2="19" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="13" r="2.5" fill="#38bdf8"/>
  <circle cx="32" cy="13" r="4.5" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Robot Agent Helmet / Head Outline -->
  <path d="M19 28 C19 22 25 20 32 20 C39 20 45 22 45 28 L45 37 C45 42 39 46 32 46 C25 46 19 42 19 37 Z" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>

  <!-- Glowing Cyan Visor (Ultra Legible at 16x16) -->
  <rect x="23" y="27" width="18" height="7" rx="3.5" fill="url(#visorGrad)"/>

  <!-- Twin Optical Nodes inside Visor -->
  <circle cx="28" cy="30.5" r="1.8" fill="#ffffff"/>
  <circle cx="36" cy="30.5" r="1.8" fill="#ffffff"/>

  <!-- Audio Earphones / Side Nodes -->
  <rect x="16.5" y="29" width="3" height="8" rx="1.5" fill="#0284c7"/>
  <rect x="44.5" y="29" width="3" height="8" rx="1.5" fill="#0284c7"/>

  <!-- Chest Neck Collar Accent -->
  <path d="M25 46 L27 50 L37 50 L39 46 Z" fill="#0284c7"/>
</svg>
