<div class="app-layout" [attr.dir]="isRtl() ? 'rtl' : 'ltr'">
  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="header-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-title">Job Hunter Agent</span>
      <span class="brand-badge">Cairo • 09:00</span>
    </div>

    <nav class="app-nav">
      <a routerLink="/overview" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📊</span>
        <span>Overview</span>
      </a>
      <a routerLink="/jobs" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">💼</span>
        <span>Job Feed</span>
      </a>
      <a routerLink="/tracker" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📌</span>
        <span>Tracker</span>
      </a>
      <a routerLink="/profile" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">👤</span>
        <span>Profile</span>
      </a>
      <a routerLink="/settings" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">⚙️</span>
        <span>Settings</span>
      </a>
    </nav>

    <div class="header-actions">
      <button (click)="toggleRtl()" class="rtl-toggle-btn" title="Toggle RTL / Arabic layout">
        {{ isRtl() ? 'LTR / English' : 'عربي / RTL' }}
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>
